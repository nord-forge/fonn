name: Prepare release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare review artifacts (no publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck, mocked tests, and build
        run: npm run check
      - name: Prepare local CLI release artifacts
        run: npm run release:prepare
      - name: Upload files for maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fonn-cli-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .release/fonn-*.tar.gz
            .release/SHA256SUMS
            .release/Casks/fonn.rb
