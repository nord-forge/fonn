name: CI

# Pull requests get one run, and pushes only run for main. Running both for
# every push to a PR branch doubled the macOS jobs, which then queued until
# GitHub cancelled them.
on:
  push:
    branches: [main]
  pull_request:

# A newer push replaces an older run of the same branch or PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the main target and its two jobs are required for main.
        # Node 26 is what Homebrew installs today; Node 22 is the oldest
        # version Fonn supports (engines: >=22).
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck, mocked tests, and build
        run: npm run check
      - name: Install the documentation site's locked dependencies
        run: npm ci --ignore-scripts --prefix site
      - name: Build the documentation site
        run: npm run docs:build
      - name: Verify committed standalone filters match the shared build
        run: git diff --exit-code -- standalone/filtering
      - name: Prepare local CLI release artifacts
        run: npm run release:prepare
